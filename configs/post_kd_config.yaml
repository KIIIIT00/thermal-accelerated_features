# =============================================================================
# configs/post_kd_config.yaml
# Thermal XFeat Post-KD 訓練設定ファイル
#
# 使い方:
#   python train_post_kd.py --config configs/post_kd_config.yaml
#   python train_post_kd.py --config configs/post_kd_config.yaml --stages 1
# =============================================================================

# ── KD フェーズ設定の参照 ────────────────────────────────────────────────────
# ここを指定するだけで kd_weights が自動的に解決される
# → train_config.yaml の ckpt_save_path + /thermal_kd_student_final.pth
kd_train_config: "configs/train_config.yaml"
 
# kd_weights を直接指定したい場合はここに書く（kd_train_config より優先）
# kd_weights: "checkpoints/thermal_kd/default/thermal_kd_student_final.pth"
kd_weights: null   # null → kd_train_config から自動導出
 
 
# ── Post-KD チェックポイントの保存先 ─────────────────────────────────────────
ckpt_save_path: "checkpoints/post_kd/default"
 
 
# ── 実行するステージ ──────────────────────────────────────────────────────────
stages:
  - 1
  - 2
 
 
# ── データセットルートパス（train_config.yaml と同じ設定を使い回す）──────────
data_roots:
  freiburg:   "/path/to/freiburg"     # ← 実際のパスに変更
  tartanrgbt: "/path/to/tartanrgbt"
  vivid:      "/path/to/vivid"
  sthereo:    "/path/to/sthereo"

splits_roots:
  freiburg:   null
  tartanrgbt: null


# ── Stage 1: Thermal Homographic Adaptation ────────────────────────────────
s1_dataset:
  - freiburg
  - tartanrgbt

s1_n_per_image: 2          # 1枚から生成するホモグラフィーペア数

# ホモグラフィーパラメータ（Thermal SLAM の実使用範囲に合わせた保守的な値）
s1_perspective_range: 0.05
s1_rotation_range:    15.0  # ±度
s1_scale_range:       0.15
s1_translation_range: 0.10  # 画像サイズに対する比率

# Stage 1 訓練パラメータ
s1_lr:          0.0001
s1_lr_step:     10000
s1_n_steps:     30000
s1_lambda_fine: 0.5    # fine_matching_loss の重み
s1_n_pts:       256    # fine_matching_loss のサンプリング点数


# ── Stage 2: 幾何整合ファインチューニング ─────────────────────────────────────
s2_dataset:
  - tartanrgbt  # 姿勢付き（valid=True）
  - freiburg    # 姿勢なし（valid=False, エピポーラ損失のみ）

s2_stride: 1   # 連続フレームの間隔

# Stage 2a: バックボーン凍結維持
s2a_lr:      0.00005
s2a_n_steps: 10000

# Stage 2b: block4/5/fusion を極小LRで解凍
s2b_lr:      0.00001
s2b_n_steps: 5000

# 損失パラメータ
s2_lambda_epi:    0.5    # エピポーラ損失の重み
s2_epi_threshold: 2.0   # Sampson距離のソフトインライア閾値（画素）


# ── 共通訓練設定 ──────────────────────────────────────────────────────────────
batch_size:        4
train_num_workers: 4
seed:              42
grad_clip:         1.0
lr_gamma:          0.5
save_ckpt_every:   2000
log_every:         100
device_num:        "0"


# ── wandb ─────────────────────────────────────────────────────────────────────
no_wandb:       false
wandb_project:  "thermal-xfeat-post-kd"
wandb_run_name: null          # null → "post_kd_s1_2" で自動生成
wandb_group:    "post_kd"
wandb_tags:
  - freiburg
  - tartanrgbt
  - stage1
  - stage2