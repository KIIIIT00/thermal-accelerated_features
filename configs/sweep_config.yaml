program: train_kd.py
method: grid

metric:
  name: loss/kd   # 最小化する指標
  goal: minimize

parameters:
  # ── Sweep で探索するハイパーパラメータ ────────────────────────────────
  lambda_kd_rel:
    values: [0.05, 0.1, 0.2]

  lambda_fpn:
    values: [0.01, 0.05, 0.1]

  # ── 固定パラメータ ────────────────────────────────────────────────────
  teacher_weights:
    value: "weights/xfeat.pt"

  n_steps:
    value: 100000

  batch_size:
    value: 8

  p_diurnal_inversion:
    value: 0.3

  fpn_sigma_min:
    value: 2.0

  fpn_sigma_max:
    value: 8.0

  infonce_temp:
    value: 0.2

  n_kd_samples:
    value: 1024

  lr:
    value: 0.0003

  lr_step:
    value: 30000

  lr_gamma:
    value: 0.5

  grad_clip:
    value: 1.0

  dataset:
    value: ["freiburg", "tartanrgbt"]

  aug_list:
    value: ["affine", "hflip", "brightness", "contrast", "gamma", "diurnal_inversion"]

# ── 起動方法 ──────────────────────────────────────────────────────────────
# ① Sweep 作成（1回のみ）— リポジトリルートから実行する
#     wandb sweep configs/sweep_config.yaml
#     → sweep ID を取得
#
# ② エージェントを GPU ごとに並列起動（3×3=9 試行を 2GPU で並列実行）
#     CUDA_VISIBLE_DEVICES=0 wandb agent <entity>/thermal-xfeat-kd/<sweep_id> &
#     CUDA_VISIBLE_DEVICES=1 wandb agent <entity>/thermal-xfeat-kd/<sweep_id> &