# =============================================================================
# configs/pipeline_config.yaml
# ThermalXFeat 堅牢モデルの全学習パイプライン設定
#
# 根拠（実験結果）:
#   - kd_only が最良（rep/geo 損失は有害、-22.4pt）
#   - kaist_morning 単独 PoseAUC=93% vs 全val=54% → 汎化不足
#   - VIVID PoseAUC=37.5% → degenerate configuration（KP 集中）
#   - Recall 135.9% → 65.7% → 記述子ドリフト（XFeat+LG 分離問題）
# =============================================================================

# ── データ設定 ───────────────────────────────────────────────────────────────
data:
  sthereo_root:  "datasets/sthereo"
  vivid_root:    "datasets/vivid"
  split:         "all"              # 全シーケンスで学習（汎化のため）
  max_pairs_per_seq: 2000
  eval_n_pairs:  200                # 評価ペア数
  stride:        3                  # SThErEO: 連続フレーム間隔
  vivid_stride:  2                  # VIVID: stride=5 は移動が大きすぎるため縮小

# ── 共通学習設定 ─────────────────────────────────────────────────────────────
training:
  device:    "0"
  seed:      42
  image_size: [640, 480]
  max_keypoints: 1024

# ── Stage 1: KD 事前学習 ─────────────────────────────────────────────────────
# 実験結果: kd_only が最良。rep/geo 損失は廃止。
# SThErEO 全9 + VIVID 19 シーケンスで多環境汎化を達成する。
stage1:
  name:        "kd_pretrain"
  output:      "checkpoints/pipeline/stage1_kd"
  epochs:      100
  batch_size:  16                   # 旧 batch=4 では 2.6% しか更新されなかった
  lr:          1.0e-4
  lr_scheduler: "cosine"
  eval_interval: 10
  best_metric:  "PoseAUC@5"         # PoseAUC で best.pth を保存

  losses:
    lambda_kd:       1.0            # 特徴マップ KD（確定有効）
    lambda_relational: 0.1          # Relational KD（intra-modal 構造転移）
    lambda_fpn:      0.05           # FPN ノイズ不変性（熱画像物理考慮）
    lambda_spatial:  0.0            # Stage1 では使わない（まず基本を安定化）
    lambda_thermal:  0.0

  augmentation:
    brightness_jitter: 0.2          # 輝度変動（時間帯変化に対応）
    contrast_jitter:   0.2          # コントラスト変動
    gaussian_noise:    0.02         # ガウスノイズ
    fpn_sigma_min:     2.0          # FPN 列ノイズ最小強度 [DN]
    fpn_sigma_max:     8.0          # FPN 列ノイズ最大強度 [DN]

  weights_init: "checkpoints/post_kd/default/post_kd_s2_final.pth"
  # ↑ proposed(init) から開始（実験で有効と確認）

# ── Stage 2: 空間分散損失を追加 ──────────────────────────────────────────────
# 目的: degenerate configuration の防止（VIVID PoseAUC 37.5%→改善）
# VIVID 実験で genuine=365 あっても PoseAUC=37.5% → KP が進行方向に集中
stage2:
  name:        "spatial_diversity"
  output:      "checkpoints/pipeline/stage2_spatial"
  epochs:      50
  batch_size:  16
  lr:          5.0e-5               # Stage1 より低い lr（fine-tune）
  lr_scheduler: "cosine"
  eval_interval: 10
  best_metric:  "PoseAUC@5"

  losses:
    lambda_kd:       1.0
    lambda_relational: 0.1
    lambda_fpn:      0.05
    lambda_spatial:  0.1            # NEW: KP 空間分散（4×4 grid entropy）
    lambda_thermal:  0.05           # NEW: 温度勾配領域への KP 誘導

  weights_init: "checkpoints/pipeline/stage1_kd/best.pth"

# ── Stage 3: LightGlue 再 fine-tune ─────────────────────────────────────────
# 目的: Stage2 で変化した記述子空間に LG を再適応
# Stage2 後: Recall が 65.7% 程度に低下する可能性
# → LG を 20 epoch 再 fine-tune して Recall を回復
stage3:
  name:        "lg_readapt"
  output:      "checkpoints/pipeline/stage3_lg"
  epochs:      20
  lr:          1.0e-4
  xfeat_weights: "checkpoints/pipeline/stage2_spatial/best.pth"
  # glue-factory の train_lightglue_gf.py を使用

# ── Stage 4: XFeat + LG 同時 fine-tune ──────────────────────────────────────
# 目的: 記述子ドリフトの根本解決
# 根拠: Recall 135.9% は XFeat と LG が同一空間にある時のみ達成可能
stage4:
  name:        "joint_finetune"
  output:      "checkpoints/pipeline/stage4_joint"
  epochs:      10
  batch_size:  8
  lr:          1.0e-5               # 非常に低い lr（壊さないよう）
  lambda_kd:   1.0
  lambda_match: 0.5                 # LG マッチング損失の重み
  best_metric: "Recall@3px"         # Recall を主指標に

  xfeat_weights: "checkpoints/pipeline/stage2_spatial/best.pth"
  lg_weights:    "checkpoints/pipeline/stage3_lg/best.tar"

# ── 最終評価設定 ──────────────────────────────────────────────────────────────
evaluation:
  # 主結果（論文記載）
  primary:
    seq:         "kaist_morning"
    n_pairs:     500
    seed:        42
    eval_all:    true

  # 補助評価（汎化確認）
  secondary:
    datasets: ["sthereo", "vivid"]
    n_pairs:  200
    matching: "lightglue"